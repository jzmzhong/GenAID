# #################################
# Inferencing embeddings for Accent identification (AID) of English Data.
#
# Authors:
#  * Created by Juan Pablo Zuluaga 2023
#  * Modified by Jinzuomu Zhong 2024
# #################################

# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 4242
__set_seed: !apply:torch.manual_seed [!ref <seed>]

# Set up folders for reading from and writing:
root: /home/s2526235
data_folder: !ref <root>/AID/data/cv-corpus-17.0-2024-03-15
csv_prepared_folder: ./CommonAccent-CV17-spk-resplit
pretrained_path: ./GenAID_v6/save/CKPT+2024-07-21+23-06-07+00
output_folder: ./results

device: 'cuda:0'
skip_prep: True
# max audio lenth allowed, higher than this is dropped
max_audio_length: 100.0

# URL for the biggest Fairseq english wav2vec2 model.
wav2vec2_hub: "facebook/wav2vec2-large-xlsr-53" # dimension of this model is 1024

# Training Parameters
sample_rate: 16000
batch_size: 16
n_accents: 13
encoder_dim: 1024 # dimensionality of the embeddings

test_dataloader_options:
    batch_size: 16
    shuffle: True

# variable to control whether to apply augmentation or not:
apply_augmentation: False

# set to TRUE to freeze all wav2vec2
freeze_wav2vec2: False
# set to true to freeze the CONV part of the wav2vec2 model
# We see an improvement of 2% with freezing CNNs
freeze_wav2vec2_conv: True

# Model parameters
activation: !name:torch.nn.GELU
dnn_layers: 2
dnn_neurons: 64

# front end Wav2vec2 - main model
wav2vec2: !new:speechbrain.lobes.models.huggingface_wav2vec.HuggingFaceWav2Vec2
    source: !ref <wav2vec2_hub>
    output_norm: True
    freeze: !ref <freeze_wav2vec2>
    freeze_feature_extractor: !ref <freeze_wav2vec2_conv>
    save_path: !ref <root>/AID/models/pretrained_xlsr_large

# possible classes are statpool, adaptivepool, avgpool
avg_pool_class: statpool

preout_mlp: !new:speechbrain.lobes.models.VanillaNN.VanillaNN
   input_shape: [null, null, !ref <encoder_dim>]
   activation: !ref <activation>
   dnn_blocks: !ref <dnn_layers>
   dnn_neurons: !ref <dnn_neurons>

output_mlp: !new:speechbrain.nnet.linear.Linear
    input_size: !ref <dnn_neurons>
    n_neurons: !ref <n_accents>
    bias: False

# Loss function to calculate during inference (this is optional)
# Additive Angular Margin
# compute_cost: !new:speechbrain.nnet.losses.LogSoftmaxWrapper
#     loss_fn: !new:speechbrain.nnet.losses.AdditiveAngularMargin
#         margin: 0.2
#         scale: 30

# standard NLL loss
compute_cost: !name:speechbrain.nnet.losses.nll_loss

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

# Keep the error stats here:
error_stats: !name:speechbrain.utils.metric_stats.MetricStats
    metric: !name:speechbrain.nnet.losses.classification_error
        reduction: batch

# Keep the error stats here:
error_stats2: !name:speechbrain.utils.metric_stats.BinaryMetricStats

# Objects in "modules" dict will have their parameters moved to the correct
# device, as well as having train()/eval() called on them by the Brain class.
modules:
    wav2vec2: !ref <wav2vec2>
    preout_mlp: !ref <preout_mlp>
    output_mlp: !ref <output_mlp>

model: !new:torch.nn.ModuleList
   - [!ref <preout_mlp>, !ref <output_mlp>]
  
label_encoder: !new:speechbrain.dataio.encoder.CategoricalEncoder

# Load fine-tuned model and classifier
pretrainer: !new:speechbrain.utils.parameter_transfer.Pretrainer
    loadables:
        model: !ref <model>
        wav2vec2: !ref <wav2vec2>
        label_encoder: !ref <label_encoder>
    paths:
        model: !ref <pretrained_path>/model.ckpt
        wav2vec2: !ref <pretrained_path>/wav2vec2.ckpt
        label_encoder: !ref <pretrained_path>/../accent_encoder.txt